[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name            = "ai-houkai"
version         = "0.18.0"
description     = "Long-term memory system for AI agents — vector search, decay & reflection"
readme          = "README.md"
requires-python = ">=3.10"
license         = "MIT"
keywords        = ["ai", "agent", "memory", "chromadb", "mcp", "llm", "rag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core deps — no LLM provider and no torch required for the memory layer.
# The default embedder is local sentence-transformers, but it lives in the
# [local] extra: it pulls torch (~2 GB), which is too much to force on an
# install that will point at a hosted embedder (ai_houkai.embed) or inject its
# own embedding_function. `pip install "ai-houkai[local]"` for the batteries.
dependencies = [
    "chromadb>=0.5.0",
    # Upper-bounded deliberately: mcp 2.0.0 deleted `mcp.server.fastmcp` (the
    # FastMCP server was renamed to `mcp.server.mcpserver`), so an unbounded
    # `mcp>=1.2.0` makes every fresh install resolve to a version this code
    # cannot import. Lift the cap in the same change that ports
    # ai_houkai/mcp_server/server.py to the 2.x API.
    "mcp>=1.2.0,<2",
]


[project.optional-dependencies]
# pip install "ai-houkai[local]"  — local sentence-transformers embeddings
local = ["sentence-transformers>=2.7.0"]

# pip install "ai-houkai[claude]"
claude = ["anthropic>=0.40.0"]

# pip install "ai-houkai[openai]"
# Only needed for the OpenAI *summarizer*; the OpenAI-compatible embedder in
# ai_houkai.embed is stdlib-only and needs no SDK.
openai = ["openai>=1.50.0"]

# pip install "ai-houkai[cli]"
cli = ["typer>=0.12", "rich>=13.7"]

# pip install "ai-houkai[tui]"  — houkai tui memory browser (includes cli deps)
tui = ["typer>=0.12", "rich>=13.7", "textual>=0.50"]

# pip install "ai-houkai[all]"
all = [
    "sentence-transformers>=2.7.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.50",
]

# pip install "ai-houkai[dev]"  — everything, including the local model
dev = [
    "sentence-transformers>=2.7.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24",
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.50",
]

# pip install "ai-houkai[test]"  — the FAST suite: no torch, no model download.
# ai_houkai.testing.FakeEmbedder replaces the local model, so this is what CI
# installs (see .github/workflows/ci.yml).
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24",
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.50",
]


[project.scripts]
# Start the MCP server: ai-houkai-mcp
# Env vars: AI_HOUKAI_PATH, AI_HOUKAI_COLLECTION
ai-houkai-mcp = "ai_houkai.mcp_server.server:run"

# Start the HTTP/REST API server: ai-houkai-serve
# Env vars: AI_HOUKAI_PATH, AI_HOUKAI_COLLECTION, AI_HOUKAI_HTTP_HOST,
#           AI_HOUKAI_HTTP_PORT, AI_HOUKAI_HTTP_TOKEN
ai-houkai-serve = "ai_houkai.http_server.server:run"

# Register the MCP server with Claude Code (~/.claude/settings.json)
ai-houkai-install-claude-code = "ai_houkai.installers.claude_code:_main"

# Register the MCP server with Cursor (~/.cursor/mcp.json)
ai-houkai-install-cursor = "ai_houkai.installers.cursor:_main"

# Register the MCP server with OpenCode (~/.config/opencode/opencode.json)
ai-houkai-install-opencode = "ai_houkai.installers.opencode:_main"

# Terminal CLI — requires pip install "ai-houkai[cli]"
houkai = "ai_houkai.cli.main:_main"


[tool.setuptools.packages.find]
where   = ["."]
include = ["ai_houkai*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]


[tool.pytest.ini_options]
testpaths = ["tests"]
