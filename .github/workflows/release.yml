name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to build"
        required: false

# Build jobs only read; the token with write access exists solely in the
# publish job that attaches artifacts to the GitHub release.
permissions:
  contents: read

jobs:
  wheel:
    name: Python wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Check the tag matches pyproject
        # A tag that disagrees with the packaged version produces artifacts
        # nobody can correlate with a release — fail before publishing.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          pkg=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag != pyproject version $pkg"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  binaries:
    name: Go binaries
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          persist-credentials: false
          # scripts/build.sh derives VERSION from `git describe`.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Cross-compile
        run: make release

      - uses: actions/upload-artifact@v4
        with:
          name: go-dist
          path: go/dist/*

  publish:
    name: Attach to the GitHub release
    needs: [wheel, binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
